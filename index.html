function unitScreen(id){const u=BOOK.find(x=>x.id===id);if(!u)return gradeScreen(1);const ls=LESSONS[String(id)]||[];const up=unitProgress(id);return `${bread([{name:'الصف الأول',route:'/grade/1'},{name:'Unit '+u.id+' — '+u.title}])}<div class="unit-detail-hero" style="--u-bg:${u.bg};--u-accent:${u.accent}"><span class="unit-emoji" aria-hidden="true">${u.icon}</span><div><span class="unit-label">Unit ${u.id}</span><h1 dir="ltr">${escapeHTML(u.title)}</h1><p>${escapeHTML(u.ar)} · ${escapeHTML(u.topic)}</p></div></div><div class="lesson-summary"><h2>📖 دروس الوحدة ${id}</h2><p>اضغط على أي درس لتتعلم كلماته وتلعب أربع ألعاب تعليمية.</p><span class="overall-progress">⭐ أكملت ${up.done} من ${up.total} دروس</span></div><div class="lesson-list">${ls.map(l=>{const p=lessonProgress(id,l.id);return `<button class="lesson-tile" style="--u-bg:${u.bg};--u-accent:${u.accent}" data-go="${lessonUrl(id,l.id)}"><span class="lesson-tile-icon">${l.icon}</span><span class="lesson-tile-body"><span class="lesson-tile-number">الدرس ${l.id}</span><strong class="lesson-tile-title">${escapeHTML(l.title)}</strong><span class="lesson-tile-ar">${escapeHTML(l.ar)}</span><span class="lesson-tile-progress">${p.complete?'🏆 مكتمل':`⭐ ${p.games} من 4 ألعاب`}</span></span><span class="lesson-tile-arrow">❮</span></button>`}).join('')}</div><p class="bottom-mini">هذه ألعاب ومفردات تدريبية أصلية منظمة حسب خريطة كتاب الصف الأول، وليست نسخة حرفية من صفحات الكتاب أو كل تدريباته.</p><div class="lesson-bottom-links"><button class="btn subtle" data-go="/grade/1">↩ جميع الوحدات</button>${id<8?`<button class="btn sky" data-go="/grade/1/unit/${id+1}">الوحدة التالية ←</button>`:''}</div>`}
function lessonScreen(uid,lid){const u=BOOK.find(x=>x.id===uid),l=getLesson(uid,lid);if(!u||!l)return unitScreen(uid);const p=lessonProgress(uid,lid);return `${bread([{name:'الصف الأول',route:'/grade/1'},{name:'Unit '+uid,route:'/grade/1/unit/'+uid},{name:'Lesson '+lid}])}<div class="lesson-detail-hero" style="--u-bg:${u.bg}"><span class="lesson-detail-icon">${l.icon}</span><div><span class="lesson-tag">Unit ${uid} • Lesson ${lid}</span><h1>${escapeHTML(l.title)}</h1><p>${escapeHTML(l.ar)} · ⭐ ${p.games} من 4 ألعاب مكتملة</p></div></div><section class="lesson-section"><h2>🔊 كلمات الدرس — اضغط على الصورة للاستماع</h2><div class="lesson-word-grid">${l.words.map(w=>`<button class="lesson-word" data-speak="${escapeHTML(w[0])}"><span class="big-pic">${w[1]}</span><span class="word-text">${escapeHTML(w[0])}</span><span class="listen">🔊 استمع</span></button>`).join('')}</div></section>${l.sentences.length?`<section class="lesson-section"><h2>🗣️ جمل قصيرة</h2><div class="lesson-sentences">${l.sentences.map(s=>`<button class="sentence-button" data-speak="${escapeHTML(s)}">${escapeHTML(s)} 🔊</button>`).join('')}</div></section>`:''}<section class="lesson-section"><h2>🎮 ألعاب هذا الدرس</h2><div class="games-grid">${GAME_MODES.map(m=>`<button class="game-mode" style="--gm-bg:${m.bg};--gm-border:${m.border}" data-go="${gameUrl(uid,lid,m.id)}"><span class="mode-picture">${m.icon}</span><strong>${m.title}</strong><small>${m.ar}</small><span class="overall-progress">${modeStars(uid,lid,m.id)?'⭐'.repeat(modeStars(uid,lid,m.id)):'ابدأ اللعب'}</span></button>`).join('')}</div><p class="lesson-help">يُحفظ أفضل إنجاز لكل لعبة في هذا المتصفح، ويمكنك إعادة اللعب في أي وقت.</p></section><div class="lesson-bottom-links"><button class="btn subtle" data-go="/grade/1/unit/${uid}">↩ دروس الوحدة</button>${getLesson(uid,lid+1)?`<button class="btn sky" data-go="${lessonUrl(uid,lid+1)}">الدرس التالي ←</button>`:''}</div>`}
function setupGame(uid,lid,mode){const l=getLesson(uid,lid),k=`${uid}-${lid}-${mode}`;if(!l||!GAME_MODES.some(m=>m.id===mode))return null;if(gameState?.key===k)return gameState;const all=shuffled(l.words);
 gameState={key:k,uid,lid,mode,words:mode==='match'?all.slice(0,Math.min(4,all.length)):all.slice(0,Math.min(5,all.length)),index:0,right:0,wrong:0,answer:null,choices:null,chosenWord:null,matched:[],matchPictures:[],tiles:null,picked:[],feedback:null,done:false,stars:0};
 if(mode==='match')gameState.matchPictures=shuffled(gameState.words.map(w=>w[0]));else prepareQuestion();return gameState}
function prepareQuestion(){const s=gameState;if(!s)return;s.answer=null;s.feedback=null;s.picked=[];s.tiles=null;const target=s.words[s.index];if(!target)return;if(s.mode==='picture'||s.mode==='listen'){const distractors=shuffled(s.words.filter(w=>w[0]!==target[0])).slice(0,3);s.choices=shuffled([target,...distractors]);}
 if(s.mode==='letters'){let words=s.words.filter(w=>/^[a-z]{3,9}$/i.test(w[0]));if(!words.length) words=s.words;const candidate=words.find(w=>w[0]===target[0])||words[s.index%words.length];s.spellWord=candidate;const chars=[...candidate[0]].map((ch,i)=>({ch,i}));s.tiles=shuffled(chars);if(s.tiles.map(x=>x.ch).join('')===candidate[0])s.tiles.reverse()}}
function finishGame(){const s=gameState;if(!s)return;s.done=true;const attempts=s.right+s.wrong;const accuracy=attempts?s.right/attempts:0;s.stars=accuracy>=.9?3:accuracy>=.7?2:1;saveGameResult(s.uid,s.lid,s.mode,s.stars);window.EAI_SOUND.play('correct');render()}
function advanceQuestion(){if(!gameState)return;gameState.index++;if(gameState.index>=gameState.words.length){finishGame();return}prepareQuestion();render()}
function gameFeedback(ok,correct){const s=gameState;if(!s||s.answer!==null)return;s.answer=ok?'correct':'wrong';s.right+=ok?1:0;s.wrong+=ok?0:1;s.feedback=ok?'أحسنت! إجابة صحيحة 🌟':`حاول مرة ثانية لاحقاً. الجواب الصحيح: ${correct}`;window.EAI_SOUND.play(ok?'correct':'wrong');render()}
function gameScreen(uid,lid,mode){const l=getLesson(uid,lid),m=GAME_MODES.find(x=>x.id===mode);if(!l||!m)return unitScreen(uid);const s=setupGame(uid,lid,mode);const total=s.words.length;const current=s.words[s.index];const progress=s.done?100:((s.index+(s.mode==='match'?s.matched.length/total:0))/total*100);
 const head=`${bread([{name:'الصف الأول',route:'/grade/1'},{name:'Unit '+uid,route:'/grade/1/unit/'+uid},{name:'Lesson '+lid,route:lessonUrl(uid,lid)},{name:m.title}])}<div class="game-shell"><div class="game-header"><small>${escapeHTML(l.title)} • ${m.ar}</small><h1>${m.icon} ${m.title}</h1><small>${s.done?'مكتمل 🎉':`${s.mode==='match'?s.matched.length+1:Math.min(s.index+1,total)} / ${total}`} • ⭐ أفضل نتيجة سابقة: ${modeStars(uid,lid,mode)}</small><div class="game-track"><span class="game-track-fill" style="width:${Math.max(0,Math.min(100,progress))}%"></span></div></div>`;
 if(s.done)return head+`<div class="game-board game-finish"><span class="big-trophy">🏆</span><h2>أحسنت يا بطل!</h2><div class="stars">${'⭐'.repeat(s.stars)}${'☆'.repeat(3-s.stars)}</div><p>الإجابات الصحيحة: ${s.right} • المحاولات الخاطئة: ${s.wrong}</p><div class="game-cta"><button class="btn sky" data-go="${lessonUrl(uid,lid)}">العودة إلى الدرس</button><button class="btn" data-restart-game="1">🔁 العب من جديد</button></div></div></div>`;
 let inner='';
 if(mode==='picture'||mode==='listen'){
 const opts=s.choices.map((w,i)=>{const isCorrect=w[0]===current[0],chosen=s.answer!==null;const cls=chosen?(isCorrect?' correct':(!isCorrect&&w[0]===s.answerChoice?' wrong':'')):'';return `<button class="answer-card${cls}" data-option="${i}" ${chosen?'disabled':''}>${mode==='picture'?`<span class="answer-pic">${w[1]}</span>`:`<span dir="ltr">${escapeHTML(w[0])}</span>`}${chosen&&isCorrect?' ✓':''}</button>`}).join('');
 inner=`<p class="game-instruction">${mode==='picture'?'اقرأ الكلمة واختر صورتها الصحيحة':'اضغط على الصوت، ثم اختر الكلمة التي سمعتها'}</p>${mode==='picture'?`<div class="game-target">${escapeHTML(current[0])}</div><button class="listen-target" data-speak="${escapeHTML(current[0])}">🔊 استمع للكلمة</button>`:`<button class="listen-target" data-speak="${escapeHTML(current[0])}">🔊 استمع للكلمة</button>`}<div class="answer-options">${opts}</div>`;
 }else if(mode==='match'){
 inner=`<p class="game-instruction">اختر كلمة من العمود الأول، ثم اضغط صورتها في العمود الثاني</p><div class="match-sets"><div class="match-column">${s.words.map((w,i)=>`<button class="match-card${s.chosenWord===w[0]?' picked':''}${s.matched.includes(w[0])?' matched':''}" data-match-word="${i}" ${s.matched.includes(w[0])?'disabled':''}>${escapeHTML(w[0])}</button>`).join('')}</div><div class="match-column">${s.matchPictures.map((word,i)=>{const w=s.words.find(x=>x[0]===word);return `<button class="match-card match-picture${s.matched.includes(word)?' matched':''}" data-match-picture="${i}" ${s.matched.includes(word)?'disabled':''}>${w[1]}</button>`}).join('')}</div></div>`;
 }else{
 const word=s.spellWord?.[0]||current[0],pic=s.spellWord?.[1]||current[1];const chosen=s.picked.map(i=>s.tiles[i].ch).join('');inner=`<p class="game-instruction">انظر إلى الصورة، واضغط الحروف بالترتيب الصحيح</p><span class="letter-picture">${pic}</span><button class="listen-target" data-speak="${escapeHTML(word)}">🔊 استمع للكلمة</button><div class="letter-current" dir="ltr"><span>${escapeHTML(chosen)||'_'}</span></div><div class="letter-tiles">${s.tiles.map((t,i)=>`<button class="letter-tile" data-tile="${i}" ${s.picked.includes(i)||s.answer!==null?'disabled':''}>${t.ch}</button>`).join('')}</div>${s.answer===null?`<div class="game-next"><button class="btn sky" data-clear-tiles="1">↺ مسح</button><button class="btn" data-check-tiles="1" ${s.picked.length!==s.tiles.length?'disabled':''}>✓ تحقق</button></div>`:''}`;
 }
 return head+`<div class="game-board">${inner}${s.feedback?`<div class="game-feedback ${s.answer==='correct'?'good':'bad'}">${escapeHTML(s.feedback)}</div>`:''}${s.answer!==null?`<div class="game-next"><button class="btn" data-game-next="1">${s.index===s.words.length-1?'🏆 اعرض النتيجة':'السؤال التالي ←'}</button></div>`:''}</div><div class="lesson-bottom-links"><button class="btn subtle" data-go="${lessonUrl(uid,lid)}">↩ العودة إلى الدرس</button></div></div>`}
// Live game actions are delegated independently of the site's existing navigation and tracing controls.
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-option],[data-match-word],[data-match-picture],[data-tile],[data-clear-tiles],[data-check-tiles],[data-game-next],[data-restart-game]');if(!el||!gameState)return;const s=gameState;if(s.done&&!el.hasAttribute('data-restart-game'))return;
 if(el.hasAttribute('data-option')&&s.answer===null){const w=s.choices[Number(el.dataset.option)];if(!w)return;s.answerChoice=w[0];const correct=s.words[s.index][0];gameFeedback(w[0]===correct,correct)}
 else if(el.hasAttribute('data-match-word')&&s.mode==='match'){const w=s.words[Number(el.dataset.matchWord)];if(!w||s.matched.includes(w[0]))return;s.chosenWord=w[0];window.EAI_SOUND.play('tap');render()}
 else if(el.hasAttribute('data-match-picture')&&s.mode==='match'){if(!s.chosenWord){showToast('اختر الكلمة أولاً');return}const word=s.matchPictures[Number(el.dataset.matchPicture)];if(s.matched.includes(word))return;const ok=s.chosenWord===word;if(ok){s.matched.push(word);s.right++;window.EAI_SOUND.play('match');s.chosenWord=null;if(s.matched.length===s.words.length){finishGame();return}}else{s.wrong++;window.EAI_SOUND.play('wrong');showToast('حاول اختيار صورة أخرى')};render()}
 else if(el.hasAttribute('data-tile')&&s.mode==='letters'&&s.answer===null){const i=Number(el.dataset.tile);if(s.picked.includes(i))return;s.picked.push(i);window.EAI_SOUND.play('tap');render()}
 else if(el.hasAttribute('data-clear-tiles')&&s.mode==='letters'){s.picked=[];render()}
 else if(el.hasAttribute('data-check-tiles')&&s.mode==='letters'&&s.answer===null){const attempt=s.picked.map(i=>s.tiles[i].ch).join('');if(s.picked.length!==s.tiles.length)return;gameFeedback(attempt.toLowerCase()===(s.spellWord?.[0]||'').toLowerCase(),s.spellWord?.[0]||'')}
 else if(el.hasAttribute('data-game-next')&&s.answer!==null)advanceQuestion();
 else if(el.hasAttribute('data-restart-game')){gameState=null;render()}
});

function traceScreen(grade){const cats=window.EAI_TRACE.categories();if(!cats[traceState.category])traceState.category='upper';let candidates=cats[traceState.category];if(traceState.category==='numbers') candidates=candidates.slice(traceState.page*10,(traceState.page+1)*10);if(!candidates.includes(traceState.symbol))traceState.symbol=candidates[0];let selected=traceState.symbol;let completed=window.EAI_TRACE.completed();return `${bread([{name:'الصف '+GRADE_AR[grade-1],route:'/grade/'+grade},{name:'تدريب الكتابة'}])}<div class="write-header"><span class="big">✍️</span><div><h1>تدريب كتابة الحروف والأرقام</h1><p>اكتب بإصبعك واتبع الخط المنقّط</p></div></div><div class="trace-layout"><div class="trace-choices"><h2>اختر ما تريد كتابته</h2><div class="trace-tabs"><button class="trace-tab ${traceState.category==='upper'?'on':''}" data-category="upper">الحروف الكبيرة<small>A–Z</small></button><button class="trace-tab ${traceState.category==='lower'?'on':''}" data-category="lower">الحروف الصغيرة<small>a–z</small></button><button class="trace-tab ${traceState.category==='numbers'?'on':''}" data-category="numbers">الأرقام<small>1–50</small></button></div>${traceState.category==='numbers'?`<div class="trace-pages">${Array.from({length:5},(_,p)=>`<button class="trace-page ${traceState.page===p?'on':''}" data-trace-page="${p}">${p*10+1}–${p*10+10}</button>`).join('')}</div>`:''}<div class="trace-symbols ${traceState.category==='numbers'?'numbers':''}" dir="ltr">${candidates.map(s=>`<button class="trace-symbol ${selected===s?'selected':''}" data-trace-symbol="${s}">${s}${completed[s]?'<span class="trace-done">✓</span>':''}</button>`).join('')}</div><p class="trace-tip">💡 ابدأ من النقطة الخضراء، واتبع اتجاه الخط. اضغط «مساعدة» إذا احتجت تلميحاً.</p></div><div class="trace-work">${window.EAI_TRACE.render(selected)}</div></div>`}
function render(){let route=(location.hash||'#/').slice(1);if(!route.startsWith('/'))route='/';currentRoute=route;const seg=route.split('/').filter(Boolean);let view='';if(seg[0]==='grade'&&Number(seg[1])>=1&&Number(seg[1])<=6){const grade=Number(seg[1]);if(seg[2]==='writing'){traceState.grade=grade;view=traceScreen(grade)}else if(grade===1&&seg[2]==='unit'&&BOOK.some(u=>u.id===Number(seg[3]))){const uid=Number(seg[3]);if(seg[4]==='lesson'&&getLesson(uid,Number(seg[5]))){if(seg[6]==='game'&&GAME_MODES.some(x=>x.id===seg[7]))view=gameScreen(uid,Number(seg[5]),seg[7]);else view=lessonScreen(uid,Number(seg[5]))}else view=unitScreen(uid)}else view=gradeScreen(grade)}else view=home();root.innerHTML=view;document.title=(seg[0]==='grade'?'الصف '+GRADE_AR[Number(seg[1])-1]+' | ':'')+'English Adventure Iraq';if(seg[2]==='writing')requestAnimationFrame(()=>{try{window.EAI_TRACE.mount(traceState.symbol)}catch(e){showToast('تعذّر تشغيل لوحة الكتابة في هذا المتصفح')}})}
const VOICE_KEY='eai_iraq_reading_profile';const SOUND_KEY='eai_iraq_sound_enabled';
const getSetting=(key)=>{try{return localStorage.getItem(key)}catch{return null}};const putSetting=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};let profile=getSetting(VOICE_KEY)==='male'?'male':'female',soundOn=getSetting(SOUND_KEY)!=='false';
let currentAudio=null,ctx=null;function note(freq,dur,gain=.015,delay=0){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator(),vol=ctx.createGain(),t=ctx.currentTime+delay;osc.type='sine';osc.frequency.setValueAtTime(freq,t);vol.gain.setValueAtTime(.0001,t);vol.gain.exponentialRampToValueAtTime(gain,t+.012);vol.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(vol);vol.connect(ctx.destination);osc.start(t);osc.stop(t+dur+.01)}catch{}}
window.EAI_SOUND={play(kind='tap'){if(kind==='correct'){note(510,.14,.025);note(640,.15,.025,.12);note(780,.22,.023,.24)}else if(kind==='wrong'){note(365,.16,.012);note(320,.17,.012,.12)}else if(kind==='match'){note(630,.11,.018);note(790,.15,.02,.09)}else if(kind==='hover'){note(740,.05,.004)}else{note(680,.08,.012)}}};
const fem=/\b(jenny|aria|zira|samantha|ava|emma|libby|sonia|hazel|catherine|susan|karen|moira|tessa|victoria|fiona|serena|natalie|allison|female)\b/i;const mal=/\b(david|mark|guy|christopher|andrew|ryan|george|daniel|thomas|eric|brian|alex|oliver|arthur|james|male)\b/i;
function readText(raw){if(!soundOn){showToast('الصوت مكتوم، فعّله من أعلى الصفحة');return}if(!('speechSynthesis'in window)){showToast('متصفحك لا يدعم قراءة النصوص');return}const synth=window.speechSynthesis;try{synth.cancel();const list=synth.getVoices().filter(v=>/^en\b|^en[-_]/i.test(v.lang||''));const matched=list.filter(v=>(profile==='female'?fem:mal).test(v.name||''));const voice=(matched.find(v=>/natural|neural|enhanced/i.test(v.name))||matched[0]||list.find(v=>/en-US/i.test(v.lang))||list[0]);const utter=new SpeechSynthesisUtterance(raw);utter.lang=voice?.lang||'en-US';if(voice)utter.voice=voice;utter.rate=.82;utter.volume=.88;utter.pitch=1;synth.speak(utter);if(!matched.length)showToast('يستخدم المتصفح صوتاً إنكليزياً بديلاً؛ قد يختلف عن الاختيار.')}catch{showToast('تعذّر تشغيل قراءة النص')}}
function toggleSound(){soundOn=!soundOn;putSetting(SOUND_KEY,String(soundOn));document.getElementById('soundButton').textContent=soundOn?'🔊 الصوت':'🔇 مكتوم';if(!soundOn)try{speechSynthesis.cancel()}catch{}}
function prevNext(delta){const arr=window.EAI_TRACE.categories()[traceState.category],at=arr.indexOf(traceState.symbol),idx=at+delta;if(idx<0||idx>=arr.length){showToast('وصلت إلى نهاية القائمة');return}traceState.symbol=arr[idx];if(traceState.category==='numbers')traceState.page=Math.floor(idx/10);render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-scroll],[data-speak],[data-category],[data-trace-symbol],[data-trace-page],[data-action],#soundButton');if(!el)return;if(el.hasAttribute('data-go')){window.EAI_SOUND.play('tap');go(el.dataset.go)}else if(el.hasAttribute('data-scroll')){window.EAI_SOUND.play('tap');document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth'})}else if(el.hasAttribute('data-speak')){window.EAI_SOUND.play('tap');readText(el.dataset.speak)}else if(el.hasAttribute('data-category')){window.EAI_SOUND.play('tap');traceState.category=el.dataset.category;traceState.page=0;traceState.symbol=window.EAI_TRACE.categories()[traceState.category][0];render()}else if(el.hasAttribute('data-trace-symbol')){window.EAI_SOUND.play('tap');traceState.symbol=el.dataset.traceSymbol;render()}else if(el.hasAttribute('data-trace-page')){window.EAI_SOUND.play('tap');traceState.page=Number(el.dataset.tracePage);traceState.symbol=String(traceState.page*10+1);render()}else if(el.hasAttribute('data-action')){const a=el.dataset.action;window.EAI_SOUND.play('tap');if(a==='trace-clear')window.EAI_TRACE.clear();else if(a==='trace-hint')window.EAI_TRACE.hint();else if(a==='trace-prev')prevNext(-1);else if(a==='trace-next')prevNext(1)}else if(el.id==='soundButton'){toggleSound()}});
document.addEventListener('pointerover',e=>{if(!e.target?.closest?.('.grade-card,.unit-card,.word-card,.head-pill,.write-panel'))return;window.EAI_SOUND.play('hover')},{passive:true});
document.getElementById('soundButton').textContent=soundOn?'🔊 الصوت':'🔇 مكتوم';document.getElementById('voiceSelect').value=profile;document.getElementById('voiceSelect').addEventListener('change',e=>{profile=e.target.value;putSetting(VOICE_KEY,profile);readText('Hello!');});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});if('speechSynthesis'in window)window.speechSynthesis.getVoices();render();

// Called only by the optional cloud-sync module after public metadata and docs load.
window.EAI_PUBLIC = {
  applyLessons(items) {
    const collection = {};
    for (let i=1;i<=8;i++) collection[String(i)]=[];
    for (const item of items) {
      if (!item || item.published!==true) continue;
      const u=Number(item.unitId), id=Number(item.lessonId);
      if (!Number.isInteger(u)||u<1||u>8||!Number.isInteger(id)||id<1) continue;
      const words=(Array.isArray(item.words)?item.words:[])
        .filter(w=>Array.isArray(w)&&w.length>=2)
        .map(w=>[String(w[0]).slice(0,80),String(w[1]).slice(0,12)]);
      if(words.length<2)continue;
      collection[String(u)].push({
        id,title:String(item.title||'Lesson').slice(0,120),
        ar:String(item.ar||''),icon:String(item.icon||'📚').slice(0,12),
        words,sentences:(Array.isArray(item.sentences)?item.sentences:[]).map(x=>String(x).slice(0,200))
      });
    }
    for (let u=1;u<=8;u++) {
      collection[String(u)].sort((a,b)=>a.id-b.id);
      LESSONS[String(u)] = collection[String(u)];
    }
    // Updating content must not interrupt a game already in progress.
    if (!location.hash.includes('/game/')) render();
  }
};
