const EAI_PALETTE=['#487cc0','#df8262','#70ad89','#aa72c5','#eea847','#49a8b7'];
function eaiVocabArt(word,oldPicture=''){
 const term=String(word||'').trim();const w=term.toLowerCase().replace(/\s+/g,' ');
 const code=EAI_COUNTRY_NAMES[w];
 if(code && (w!=='english'||/🏴|🇬🇧|🇺🇸|england/i.test(String(oldPicture||''))))return eaiFlagGraphic(code,term);
 let digest=0;for(let j=0;j<w.length;j++) digest=(digest*31+w.charCodeAt(j))>>>0;
 const ink=EAI_PALETTE[digest%EAI_PALETTE.length];
 if(EAI_ILLUSTRATED_CARDS[w]){
   return `<span class="eai-vocab-art eai-illustration" role="img" aria-label="${escapeHTML(term)}"><img src="${EAI_ILLUSTRATED_CARDS[w]}" alt="${escapeHTML(term)}" draggable="false" loading="lazy" decoding="async"></span>`;
 }
 const spec=EAI_VOCAB_PICTURES[w];const scene=spec?.[2]||(['ladder','lamp','shelf','roof','wardrobe','dates','swing','slide','bedroom','chair','desk','trip'].includes(w)?w:'');
 const actualScene=(scene==='head'||scene==='arms'||scene==='leg'||scene==='feet'||scene==='big'||scene==='long')?'':scene;
 let inner=eaiSpecialArt(w)||eaiExtraArt(w)||(actualScene?eaiSceneArt(actualScene,spec?.[1]):'');
 if(!inner){
   const icon=EAI_FA_DRAWINGS[EAI_DRAWING_MAP[w]];
   if(icon){let paths=Array.isArray(icon.p)?icon.p:[icon.p];inner=`<svg viewBox="0 0 ${icon.w} ${icon.h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="eai-drawing-vector"><g fill="${ink}">${paths.map(d=>`<path d="${d}"/>`).join('')}</g></svg>`}
   else {inner=`<span class="eai-word-drawing" dir="ltr" aria-hidden="true">${escapeHTML(term)}</span>`}
 }
 return `<span class="eai-vocab-art eai-drawn" role="img" aria-label="${escapeHTML(term)}" data-illustration-word="${escapeHTML(w)}" style="--illustration-ink:${ink}">${inner}</span>`;
}

function render(){let route=(location.hash||'#/').slice(1);if(!route.startsWith('/'))route='/';currentRoute=route;const seg=route.split('/').filter(Boolean);let view='';if(seg[0]==='grade'&&Number(seg[1])>=1&&Number(seg[1])<=6){const grade=Number(seg[1]);if(seg[2]==='summaries'&&grade>=4){const unitNum=Number(seg[4]);if(seg[3]==='unit'&&Number.isInteger(unitNum)&&unitNum>=1&&unitNum<=8){if(seg[5]==='section'&&seg[6])view=summarySectionScreen(grade,unitNum,seg[6]);else view=summaryUnitScreen(grade,unitNum)}else view=summariesScreen(grade)}else if(seg[2]==='writing'&&grade<=3){traceState.grade=grade;view=traceScreen(grade)}else if((grade>=1&&grade<=6)&&seg[2]==='unit'&&bookForGrade(grade).some(u=>u.id===Number(seg[3]))){const uid=Number(seg[3]);if(seg[4]==='lesson'&&getLesson(uid,Number(seg[5]),grade)){if(seg[6]==='game'&&GAME_MODES.some(x=>x.id===seg[7]))view=gameScreen(uid,Number(seg[5]),seg[7],grade);else view=lessonScreen(uid,Number(seg[5]),grade)}else view=unitScreen(uid,grade)}else view=gradeScreen(grade)}else view=home();root.innerHTML=view;document.title=(seg[0]==='grade'?'الصف '+GRADE_AR[Number(seg[1])-1]+' | ':'')+'English Adventure Iraq';if(seg[2]==='writing')requestAnimationFrame(()=>{try{window.EAI_TRACE.mount(traceState.symbol)}catch(e){showToast('تعذّر تشغيل لوحة الكتابة في هذا المتصفح')}})}
const VOICE_KEY='eai_iraq_reading_profile';const SOUND_KEY='eai_iraq_sound_enabled';

let currentAudio=null,ctx=null;function note(freq,dur,gain=.015,delay=0){if(!soundOn)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const osc=ctx.createOscillator(),vol=ctx.createGain(),t=ctx.currentTime+delay;osc.type='sine';osc.frequency.setValueAtTime(freq,t);vol.gain.setValueAtTime(.0001,t);vol.gain.exponentialRampToValueAtTime(gain,t+.012);vol.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(vol);vol.connect(ctx.destination);osc.start(t);osc.stop(t+dur+.01)}catch{}}

// Never silently label the first available female voice as male.
const fem=/\b(jenny|aria|zira|samantha|ava|emma|libby|sonia|hazel|catherine|susan|karen|moira|tessa|victoria|fiona|serena|natalie|allison|female|woman)\b/i;
const mal=/\b(david|mark|guy|christopher|andrew|ryan|george|daniel|thomas|eric|brian|alex|oliver|arthur|james|male|man)\b/i;
const MALE_DEVICE_VOICE_KEY='eai_android_selected_male_voice_v1';
let availableEnglishVoices=[];
function voiceIdentity(v){return [v.voiceURI||'',v.name||'',v.lang||''].join('|')}
function refreshEnglishVoices(){
  try{availableEnglishVoices=window.speechSynthesis.getVoices().filter(v=>/^en(?:$|[-_])/i.test(v.lang||''));}
  catch{availableEnglishVoices=[]}
  return availableEnglishVoices;

function savedMaleVoice(list){
  const saved=getSetting(MALE_DEVICE_VOICE_KEY);
  return saved?list.find(v=>voiceIdentity(v)===saved):null;
}
function voiceForProfile(list){
  if(profile==='male'){
    return savedMaleVoice(list)||list.find(v=>mal.test(v.name||'')&&!fem.test(v.name||''))||null;
  }
  const candidates=list.filter(v=>fem.test(v.name||'')&&!mal.test(v.name||''));

function speakUsingVoice(raw,voice){

    const choose=document.createElement('button');choose.type='button';choose.textContent='✓ اعتماد';choose.style.cssText='border:0;border-radius:10px;background:#188866;color:#fff;padding:8px 10px;cursor:pointer';
    choose.addEventListener('click',()=>{putSetting(MALE_DEVICE_VOICE_KEY,voiceIdentity(voice));profile='male';putSetting(VOICE_KEY,profile);document.getElementById('voiceSelect').value='male';overlay.remove();speakUsingVoice('Hello! I am Zack.',voice);showToast('تم حفظ الصوت المختار على هذا الهاتف')});row.appendChild(choose);
    panel.appendChild(row);
  });
  const caution=document.createElement('p');caution.textContent='إذا كانت كل الأصوات المعروضة نسائية، فلا يستطيع الموقع إنشاء صوت رجل من تلقاء نفسه. ثبّت صوتاً إنكليزياً رجاليّاً من إعدادات تحويل النص إلى كلام في الهاتف، ثم أعد فتح «ضبط صوت الهاتف».';

  overlay.appendChild(panel);document.body.appendChild(overlay);

}
function readText(raw){
  if(!soundOn){showToast('الصوت مكتوم، فعّله من أعلى الصفحة');return}
  if(!('speechSynthesis'in window)){showToast('متصفحك لا يدعم قراءة النصوص');return}
  try{
    const list=refreshEnglishVoices();
    if(!list.length){showToast('أصوات الهاتف لم تُحمّل بعد. اضغط على النص مرة ثانية.');return}
    const voice=voiceForProfile(list);
    if(profile==='male'&&!voice){showDeviceVoiceSetup();return}
    speakUsingVoice(raw,voice);
  }catch{showToast('تعذّر تشغيل قراءة النص')}

document.addEventListener('click',e=>{const el=e.target.closest('[data-go],[data-scroll],[data-speak],[data-category],[data-trace-symbol],[data-trace-page],[data-action],#soundButton');if(!el)return;if(el.hasAttribute('data-go')){window.EAI_SOUND.play('tap');go(el.dataset.go)}else if(el.hasAttribute('data-scroll')){window.EAI_SOUND.play('tap');document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth'})}else if(el.hasAttribute('data-speak')){window.EAI_SOUND.play('tap');readText(el.dataset.speak)}else if(el.hasAttribute('data-category')){window.EAI_SOUND.play('tap');traceState.category=el.dataset.category;traceState.page=0;traceState.symbol=window.EAI_TRACE.categories()[traceState.category][0];render()}else if(el.hasAttribute('data-trace-symbol')){window.EAI_SOUND.play('tap');traceState.symbol=el.dataset.traceSymbol;render()}else if(el.hasAttribute('data-trace-page')){window.EAI_SOUND.play('tap');traceState.page=Number(el.dataset.tracePage);traceState.symbol=String(traceState.page*10+1);render()}else if(el.hasAttribute('data-action')){const a=el.dataset.action;window.EAI_SOUND.play('tap');if(a==='trace-clear')window.EAI_TRACE.clear();else if(a==='trace-hint')window.EAI_TRACE.hint();else if(a==='trace-prev')prevNext(-1);else if(a==='trace-next')prevNext(1)}else if(el.id==='soundButton'){toggleSound()}});

window.EAI_PUBLIC = {
  applyLessons(items) {
    const grouped={1:{},2:{},3:{},4:{},5:{},6:{}};
    for (const g of [1,2,3,4,5,6]) for (let i=1;i<=8;i++) grouped[g][String(i)]=[];
    let hasGrade2=false,hasGrade3=false,hasGrade4=false,hasGrade5=false,hasGrade6=false;
    for(const item of items){
      if(!item||item.published!==true)continue;
      const grade=Number(item.grade||1),u=Number(item.unitId),id=Number(item.lessonId);
      if(![1,2,3,4,5,6].includes(grade)||!Number.isInteger(u)||u<1||u>8||!Number.isInteger(id)||id<1)continue;
      if(grade===2)hasGrade2=true;if(grade===3)hasGrade3=true;if(grade===4)hasGrade4=true;if(grade===5)hasGrade5=true;if(grade===6)hasGrade6=true;
      const words=(Array.isArray(item.words)?item.words:[]).map(w=>Array.isArray(w)?[String(w[0]||''),String(w[1]||'📘')]:w&&typeof w==='object'?[String(w.text||''),String(w.picture||'📘')]:[]).filter(w=>w.length===2&&w[0].trim()&&(grade!==2||w[0].trim().toLowerCase()!=='name'));
